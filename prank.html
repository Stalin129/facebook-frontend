<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login Error</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, Helvetica, sans-serif;

            background: linear-gradient(135deg, #f0f2f5, #e4e6eb);

            color: #1c1e21;
        }

        .error-box {
            width: 90%;
            max-width: 480px;

            background: #ffffff;

            padding: 42px 35px;

            border-radius: 18px;

            text-align: center;

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.12);

            animation: boxAppear 0.6s ease-out;
        }

        /* Error icon */

        .error-icon {
            width: 72px;
            height: 72px;

            margin: 0 auto 22px;

            border-radius: 50%;

            background: #fff0f0;

            display: flex;
            align-items: center;
            justify-content: center;

            color: #e41e3f;

            font-size: 42px;
            font-weight: bold;

            animation: iconPop 0.6s ease-out;
        }

        h1 {
            margin: 0 0 12px;

            font-size: 30px;
            font-weight: 700;
        }

        .main-message {
            margin: 0 0 10px;

            font-size: 18px;

            color: #333;
        }

        .sub-message {
            margin: 0 auto;

            max-width: 380px;

            font-size: 15px;

            line-height: 1.6;

            color: #65676b;
        }

        /* Demo notice */

        .demo-notice {
            margin-top: 25px;

            padding: 14px 16px;

            background: #f5f9ff;

            border: 1px solid #d8e7ff;

            border-radius: 10px;

            color: #315b91;

            font-size: 14px;

            line-height: 1.5;
        }

        /* Button */

        .back-button {
            margin-top: 28px;

            width: 100%;

            height: 50px;

            border: none;

            border-radius: 25px;

            background: #1877f2;

            color: white;

            font-size: 16px;

            font-weight: 600;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                background 0.2s ease,
                box-shadow 0.2s ease;
        }

        .back-button:hover {
            background: #166fe5;

            transform: translateY(-2px);

            box-shadow:
                0 6px 15px rgba(24, 119, 242, 0.25);
        }

        .back-button:active {
            transform: scale(0.98);
        }

        /* Small footer */

        .footer {
            margin-top: 22px;

            font-size: 12px;

            color: #90949c;
        }

        /* Animations */

        @keyframes boxAppear {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.96);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes iconPop {
            0% {
                opacity: 0;
                transform: scale(0.5);
            }

            70% {
                transform: scale(1.1);
            }

            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Mobile */

        @media (max-width: 600px) {

            body {
                padding: 20px;
            }

            .error-box {
                width: 100%;

                padding: 35px 22px;

                border-radius: 16px;
            }

            .error-icon {
                width: 65px;
                height: 65px;

                font-size: 36px;
            }

            h1 {
                font-size: 26px;
            }

            .main-message {
                font-size: 17px;
            }

            .sub-message {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <div class="error-box">

        <!-- Error icon -->
        <div class="error-icon">
            !
        </div>

        <h1>Login Error</h1>

        <p class="main-message">
            Your login could not be completed.
        </p>

        <p class="sub-message">
            Something went wrong while processing this login.
            Please return to the login page and try again.
        </p>

        <!-- Safe demo message -->
       

        <button
            class="back-button"
            onclick="window.location.href='index.html'">
            Return to Login
        </button>

        <div class="footer">
            Garena experience • Real account access
        </div>

    </div>

</body>
</html>
