<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="image/ChatGPT Image Aug 31, 2026, 08_27_55 AM.png">
    <title>Garena Tournament</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: white;
        }

        /* =========================
           NAVBAR
        ========================= */

        .navbar {
            height: 70px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 17%;

            background: white;
        }

        .logo {
            display: flex;
            align-items: center;

            gap: 8px;

            color: #e21b23;

            font-size: 20px;
        }

        .logo-icon {
            font-size: 30px;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            gap: 50px;
        }

        .nav-links a {
            text-decoration: none;

            color: #111;

            font-size: 14px;
        }

        .nav-links a:hover {
            color: #e21b23;
        }


        /* =========================
           HOME HERO
        ========================= */

        .hero {

            height: calc(100vh - 70px);

            min-height: 600px;

            position: relative;

            background-image:
                url("image/freefire-hero.jpg");

            background-size: cover;

            background-position: center;

            overflow: hidden;
        }


        /* Dark overlay */

        .hero::after {

            content: "";

            position: absolute;

            inset: 0;

            background:
                linear-gradient(
                    to bottom,
                    rgba(0,0,0,0.05),
                    rgba(0,0,0,0.35)
                );

            pointer-events: none;
        }


        /* =========================
           ARROWS
        ========================= */

        .arrow {

            position: absolute;

            top: 50%;

            transform: translateY(-50%);

            width: 60px;
            height: 60px;

            border-radius: 50%;

            background: rgba(0,0,0,0.35);

            color: white;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 40px;

            z-index: 2;

            cursor: pointer;
        }

        .arrow:hover {
            background: rgba(0,0,0,0.6);
        }

        .left-arrow {
            left: 18%;
        }

        .right-arrow {
            right: 18%;
        }


        /* =========================
           CONTENT
        ========================= */

        .hero-content {

            position: absolute;

            z-index: 2;

            left: 50%;

            bottom: 80px;

            transform: translateX(-50%);

            width: 600px;

            text-align: center;

            color: white;
        }

        .game-title {

            font-size: 65px;

            font-weight: 900;

            font-style: italic;

            margin-bottom: 15px;

            text-shadow:
                0 3px 10px rgba(0,0,0,0.7);
        }

        .description {

            font-size: 19px;

            line-height: 1.5;

            margin-bottom: 25px;
        }


        /* =========================
           PLAY BUTTON
        ========================= */

        .play-button {

            display: inline-flex;

            align-items: center;

            gap: 10px;

            padding: 13px 30px;

            border-radius: 30px;

            border: 1px solid #ff3030;

            background: rgba(0,0,0,0.65);

            color: #ff3030;

            text-decoration: none;

            font-size: 20px;

            font-weight: bold;

            transition: 0.2s;
        }

        .play-button:hover {

            background: #ff3030;

            color: white;
        }


        /* =========================
           DOTS
        ========================= */

        .dots {

            position: absolute;

            z-index: 3;

            bottom: 35px;

            left: 50%;

            transform: translateX(-50%);

            display: flex;

            gap: 10px;
        }

        .dot {

            width: 9px;
            height: 9px;

            border-radius: 50%;

            background: white;
        }

        .dot.active {

            width: 25px;

            border-radius: 10px;
        }


        /* =========================
           MOBILE
        ========================= */

        @media(max-width: 800px) {

            .navbar {

                height: 65px;

                padding: 0 20px;

                justify-content: center;
            }

            .nav-links {
                display: none;
            }

            .hero {

                height: calc(100vh - 65px);

                min-height: 600px;

                background-position: center;
            }

            .hero-content {

                width: 90%;

                bottom: 70px;
            }

            .game-title {

                font-size: 40px;
            }

            .description {

                font-size: 15px;
            }

            .play-button {

                font-size: 16px;

                padding: 11px 25px;
            }

            .arrow {

                width: 42px;
                height: 42px;

                font-size: 28px;
            }

            .left-arrow {
                left: 15px;
            }

            .right-arrow {
                right: 15px;
            }
        }
        /* =========================
   TOURNAMENT REWARDS
========================= */

.prize-section {
    margin-top: 20px;
    margin-bottom: 22px;

    animation: prizeAppear 1s ease forwards;
}


.prize-heading {
    font-size: 13px;

    font-weight: 700;

    letter-spacing: 2px;

    margin-bottom: 10px;

    color: #ffffff;

    text-shadow:
        0 2px 8px rgba(0, 0, 0, 0.8);
}


/* Cards container */

.prize-cards {

    display: flex;

    justify-content: center;

    align-items: stretch;

    gap: 10px;
}


/* Individual card */

.prize-card {

    width: 105px;

    padding: 10px 8px;

    border-radius: 12px;

    background:
        rgba(10, 5, 30, 0.72);

    border: 1px solid rgba(255, 255, 255, 0.35);

    backdrop-filter: blur(8px);

    -webkit-backdrop-filter: blur(8px);

    text-align: center;

    box-shadow:
        0 8px 25px rgba(0, 0, 0, 0.35);

    transition:
        transform 0.3s ease,
        box-shadow 0.3s ease;

    animation: cardFloat 3s ease-in-out infinite;
}


/* Hover */

.prize-card:hover {

    transform:
        translateY(-8px)
        scale(1.04);

    box-shadow:
        0 15px 35px rgba(0, 0, 0, 0.55);
}


/* Different animation delays */

.prize-card.first {
    animation-delay: 0s;

    border-color: rgba(255, 215, 0, 0.8);
}

.prize-card.second {
    animation-delay: 0.2s;

    border-color: rgba(220, 220, 220, 0.7);
}

.prize-card.third {
    animation-delay: 0.4s;

    border-color: rgba(205, 127, 50, 0.8);
}


/* Medal */

.rank {

    font-size: 25px;

    margin-bottom: 3px;

    filter:
        drop-shadow(
            0 2px 5px rgba(0,0,0,0.5)
        );
}


/* Place */

.place {

    font-size: 11px;

    font-weight: 600;

    color: white;

    margin-bottom: 5px;
}


/* Prize amount */

.reward {

    font-size: 20px;

    font-weight: 800;

    color: white;

    text-shadow:
        0 0 10px rgba(255,255,255,0.35);
}


/* First place glow */

.first .reward {

    color: #ffd700;

    text-shadow:
        0 0 8px rgba(255,215,0,0.8),
        0 0 20px rgba(255,215,0,0.35);
}


/* Second */

.second .reward {

    color: #eeeeee;
}


/* Third */

.third .reward {

    color: #cd7f32;

    text-shadow:
        0 0 10px rgba(205,127,50,0.6);
}


/* =========================
   ANIMATIONS
========================= */

@keyframes prizeAppear {

    0% {

        opacity: 0;

        transform:
            translateY(25px)
            scale(0.95);
    }

    100% {

        opacity: 1;

        transform:
            translateY(0)
            scale(1);
    }
}


@keyframes cardFloat {

    0%,
    100% {

        transform: translateY(0);
    }

    50% {

        transform: translateY(-4px);
    }
}

    </style>

</head>


<body>

            <!-- PRIZE POOL -->

<div class="prize-section">

</body>

</html>
